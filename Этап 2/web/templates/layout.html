{{define "layout"}}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Учёт трат</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/expenses">Список трат</a>
            <a href="/expenses/new">Добавить</a>
        </nav>
    </header>
    <main>
        <!-- Если IsForm = true, показываем форму, иначе — список -->
        {{if .IsForm}}
            {{template "form_content" .}}
        {{else}}
            {{template "index_content" .}}
        {{end}}
    </main>
</body>
</html>
{{end}}
