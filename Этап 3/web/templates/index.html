{{define "index_content"}}
<h1>Мои траты</h1>

{{if .Expenses}}
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Сумма</th>
      <th>Описание</th>
      <th>Дата</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {{range .Expenses}}
    <tr>
      <td>{{.ID}}</td>
      <td>{{printf "%.2f" .Amount}}</td>
      <td>{{.Description}}</td>
      <td>{{.Date.Format "2006-01-02"}}</td>
      <td>
        <!-- Кнопка редактирования (ссылка) -->
        <a href="/expenses/{{.ID}}/edit">Ред.</a>
        
        <!-- Кнопка удаления (обязательно через POST-форму) -->
        <form action="/expenses/{{.ID}}/delete" method="POST" style="display:inline; margin-left: 10px;">
            <button type="submit" onclick="return confirm('Вы уверены, что хотите удалить эту трату?')">Удалить</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{else}}
<p>Пока трат нет. <a href="/expenses/new">Добавить первую</a>.</p>
{{end}}
{{end}}
