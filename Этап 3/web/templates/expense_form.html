{{define "form_content"}}
  {{if .Expense}}
    <h1>Редактировать трату</h1>
    <form method="POST" action="/expenses/{{.Expense.ID}}/edit">
  {{else}}
    <h1>Добавить трату</h1>
    <form method="POST" action="/expenses">
  {{end}}

    <p>
      <label>Сумма
        <input type="number" step="0.01" min="0.01" name="amount" required 
               value='{{if .Expense}}{{.Expense.Amount}}{{end}}'>
      </label>
    </p>
    <p>
      <label>Описание
        <input type="text" name="description" required 
               value='{{if .Expense}}{{.Expense.Description}}{{end}}'>
      </label>
    </p>
    <p>
      <label>Дата
        <input type="date" name="date" required 
               value='{{if .Expense}}{{.Expense.Date.Format "2006-01-02"}}{{end}}'>
      </label>
    </p>
    
    <button type="submit">Сохранить</button>
    <a href="/expenses" style="margin-left: 15px; color: #666; text-decoration: none;">Отмена</a>
  </form>
{{end}}
